version: "3.8"

services:
  backend:
    build: .
    container_name: mcp-chat-backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - JAVA_API_BASE=${JAVA_API_BASE:-http://host.docker.internal:8080}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
    volumes:
      - ./backend:/app/backend
      - ./mcp_servers:/app/mcp_servers
      - ./openapi_specs:/app/openapi_specs
    working_dir: /app

  frontend:
    build: .
    container_name: mcp-chat-frontend
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app/frontend
    working_dir: /app
    depends_on:
      - backend
