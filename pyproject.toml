[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lims-mcp-server"
version = "1.0.0"
description = "LIMS 系统 MCP Server — 客户/合同/案件/用户查询"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
lims-mcp = "mcp_servers.unified_server:main"

[tool.setuptools]
py-modules = []
